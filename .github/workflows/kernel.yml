name: Build Kernel
run-name: "#${{ inputs.build_number || env.BUILD_NUMBER || github.run_number }} - Build Kernel (${{ github.ref_name }})"

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Nomor Build (Kosongkan untuk otomatis mengikuti nomor run workflow atau default)'
        required: false
        default: ''
      device:
        description: 'Target Device Code'
        required: false
        default: 'alioth'
      ksu:
        description: 'Enable KernelSU (true/false)'
        required: false
        default: 'true'
      target_os:
        description: 'Target OS (aosp)'
        required: false
        default: 'aosp'
  push:
    branches:
      - 'seventeen-custom'
    paths:
      - 'build_kernel.sh'
      - 'patches/**'
      - 'arch/arm64/configs/**'
      - 'fs/**'
      - 'include/**'
      - 'kernel/**'
      - 'drivers/**'
      - 'net/**'
      - 'security/**'
      - '.github/workflows/kernel.yml'

permissions:
  contents: write

env:
  BUILD_NUMBER: 3 # Penomoran build kustom (diulang ke 3 sesuai permintaan pengguna)

jobs:
  build-kernel:
    name: "Build Kernel (${{ matrix.variant_name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: official
            variant_name: "BakaSU Official"
            variant_label: "BakaSU"
          - variant: custom
            variant_name: "BakaSU CustomSU"
            variant_label: "CustomSU"

    steps:
    - name: "Checkout Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: "Set up Build Dependencies"
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex gawk git gnupg \
          libelf-dev libncurses-dev libssl-dev lzop patch python3 rsync zip zlib1g-dev

    - name: "Determine Effective Build Number"
      run: |
        BN="${{ github.event.inputs.build_number }}"
        if [ -z "$BN" ]; then
          BN="${{ env.BUILD_NUMBER }}"
        fi
        if [ -z "$BN" ]; then
          BN="${{ github.run_number }}"
        fi
        echo "EFFECTIVE_BUILD_NUM=${BN}" >> $GITHUB_ENV

    - name: "Cache ccache"
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ matrix.variant }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ matrix.variant }}-
          ${{ runner.os }}-kernel-ccache-

    - name: "Cache zyc-clang 16 Toolchain"
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ~/zyc-clang
        key: zyc-clang-16.0.6-20260807

    - name: "Setup zyc-clang 16 Toolchain"
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxf Clang-16.0.6-20260807.tar.gz
        rm -f Clang-16.0.6-20260807.tar.gz

    - name: "Configure ccache"
      run: |
        ccache -M 5G
        ccache -z

    - name: "Run Build Script"
      run: |
        sed -i 's/\r$//' build_kernel.sh
        chmod +x build_kernel.sh

        DEV="${{ github.event.inputs.device || 'alioth' }}"
        KSU_FLAG="${{ github.event.inputs.ksu || 'true' }}"
        OS_FLAG="${{ github.event.inputs.target_os || 'aosp' }}"
        VARIANT="${{ matrix.variant }}"
        export BUILD_NUMBER="${{ env.EFFECTIVE_BUILD_NUM }}"

        ARGS="$DEV"
        if [ "$KSU_FLAG" = "true" ]; then
          ARGS="$ARGS ksu"
        fi
        ARGS="$ARGS $OS_FLAG $VARIANT $BUILD_NUMBER"

        echo "Executing: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: "Upload Flashable Direct Kernel Artifact"
      uses: actions/upload-artifact@v4
      with:
        name: "${{ env.EFFECTIVE_BUILD_NUM }}-${{ matrix.variant_label }}"
        path: pkg_${{ matrix.variant_label }}/*
        compression-level: 9

  publish-release:
    name: "Publish Flashable Releases"
    needs: build-kernel
    runs-on: ubuntu-latest
    steps:
      - name: "Determine Effective Build Number"
        run: |
          BN="${{ github.event.inputs.build_number }}"
          if [ -z "$BN" ]; then
            BN="${{ env.BUILD_NUMBER }}"
          fi
          if [ -z "$BN" ]; then
            BN="${{ github.run_number }}"
          fi
          echo "EFFECTIVE_BUILD_NUM=${BN}" >> $GITHUB_ENV

      - name: "Download Built Package Artifacts"
        uses: actions/download-artifact@v4
        with:
          path: release_staging

      - name: "Repack Direct Flashable ZIPs for GitHub Releases"
        run: |
          mkdir -p release_direct
          for d in release_staging/*; do
            if [ -d "$d" ]; then
              TAG_NAME=$(basename "$d")
              cd "$d"
              zip -r9 "../../release_direct/${TAG_NAME}.zip" * -x .git
              cd ../..
            fi
          done

      - name: "Create GitHub Release & Upload Direct ZIP Assets"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.EFFECTIVE_BUILD_NUM }}-alioth
          name: "Kernel alioth Build #${{ env.EFFECTIVE_BUILD_NUM }}"
          body: |
            ### Automated Flashable Kernel Release for POCO F3 (alioth)
            - **Build Number**: `#${{ env.EFFECTIVE_BUILD_NUM }}`
            - **Branch**: `seventeen-custom`
            - **Commit**: `${{ github.sha }}`

            Unduh langsung berkas ZIP murni di bawah ini (1-klik langsung flash di Recovery tanpa ekstraksi ganda):
            - `${{ env.EFFECTIVE_BUILD_NUM }}-BakaSU.zip` (Varian BakaSU Resmi)
            - `${{ env.EFFECTIVE_BUILD_NUM }}-CustomSU.zip` (Varian BakaSU CustomSU)
          files: |
            release_direct/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
