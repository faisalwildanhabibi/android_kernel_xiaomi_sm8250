name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code'
        required: false
        default: 'alioth'
      ksu:
        description: 'Enable KernelSU (true/false)'
        required: false
        default: 'true'
      target_os:
        description: 'Target OS (aosp)'
        required: false
        default: 'aosp'
  push:
    branches:
      - 'seventeen-custom'
    paths:
      - 'build_kernel.sh'
      - 'patches/**'
      - 'arch/arm64/configs/**'
      - 'fs/**'
      - 'include/**'
      - 'kernel/**'
      - 'drivers/**'
      - 'net/**'
      - 'security/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build-kernel:
    name: "Build Kernel (${{ matrix.variant_name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: official
            variant_name: "BakaSU Official"
            tag_name: "BakaSU-SuSFS-NoMount-WG"
          - variant: custom
            variant_name: "BakaSU CustomSU"
            tag_name: "CustomSU-SuSFS-NoMount-WG"

    steps:
    - name: "Checkout Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: "Set up Build Dependencies"
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex gawk git gnupg \
          libelf-dev libncurses-dev libssl-dev lzop patch python3 rsync zip zlib1g-dev

    - name: "Cache ccache"
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ matrix.variant }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ matrix.variant }}-
          ${{ runner.os }}-kernel-ccache-

    - name: "Cache zyc-clang 16 Toolchain"
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ~/zyc-clang
        key: zyc-clang-16.0.6-20260807

    - name: "Setup zyc-clang 16 Toolchain"
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxf Clang-16.0.6-20260807.tar.gz
        rm -f Clang-16.0.6-20260807.tar.gz

    - name: "Configure ccache"
      run: |
        ccache -M 5G
        ccache -z

    - name: "Run Build Script"
      run: |
        sed -i 's/\r$//' build_kernel.sh
        chmod +x build_kernel.sh

        DEV="${{ github.event.inputs.device || 'alioth' }}"
        KSU_FLAG="${{ github.event.inputs.ksu || 'true' }}"
        OS_FLAG="${{ github.event.inputs.target_os || 'aosp' }}"
        VARIANT="${{ matrix.variant }}"

        ARGS="$DEV"
        if [ "$KSU_FLAG" = "true" ]; then
          ARGS="$ARGS ksu"
        fi
        ARGS="$ARGS $OS_FLAG $VARIANT"

        echo "Executing: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: "Generate Cryptographic Checksum"
      run: |
        sha256sum Kernel-*.zip > SHA256SUMS
        echo "### Cryptographic Release Integrity (${{ matrix.variant_name }})" >> $GITHUB_STEP_SUMMARY
        echo "| Artifact | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        while read -r sum file; do
          echo "| \`$file\` | \`$sum\` |" >> $GITHUB_STEP_SUMMARY
        done < SHA256SUMS

    - name: "Upload Flashable ZIP & Checksums (Artifact Backup)"
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-${{ github.event.inputs.device || 'alioth' }}-${{ matrix.tag_name }}-${{ github.run_id }}
        path: |
          Kernel-*.zip
          SHA256SUMS
        compression-level: 0

  publish-release:
    name: "Publish Flashable Releases"
    needs: build-kernel
    runs-on: ubuntu-latest
    steps:
      - name: "Download All Artifacts"
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: "Create GitHub Release & Upload Direct Assets"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-alioth
          name: "Kernel alioth Release #${{ github.run_number }}"
          body: |
            ### Automated Flashable Kernel Release for POCO F3 (alioth)
            - **Branch**: `seventeen-custom`
            - **Workflow Run**: [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Commit**: `${{ github.sha }}`
            
            Unduh langsung berkas ZIP di bawah ini (1-klik flashable tanpa ekstraksi pembungkus ganda):
            - `Kernel-alioth-*-BakaSU-*.zip` (Varian BakaSU Resmi)
            - `Kernel-alioth-*-CustomSU-*.zip` (Varian BakaSU CustomSU)
          files: |
            release_assets/Kernel-*.zip
            release_assets/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
