name: Build Kernel Poco F3 (alioth)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device (Poco F3)'
        required: true
        default: 'alioth'
        type: choice
        options:
          - alioth
      ksu:
        description: 'Enable ReSukiSU + SuSFS'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS'
        required: true
        type: choice
        default: 'aosp'
        options:
          - aosp
          - both

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device || 'alioth' }} | ReSukiSU:${{ github.event.inputs.ksu != false }} | OS:${{ github.event.inputs.target_os || 'aosp' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-alioth-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-alioth-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        
        DEVICE="${{ github.event.inputs.device }}"
        [ -z "$DEVICE" ] && DEVICE="alioth"
        
        KSU_FLAG=""
        if [ "${{ github.event.inputs.ksu }}" != "false" ]; then
          KSU_FLAG="ksu"
        fi
        
        OS_FLAG="${{ github.event.inputs.target_os }}"
        [ -z "$OS_FLAG" ] && OS_FLAG="aosp"
        
        echo "Executing: ./build_kernel.sh $DEVICE $KSU_FLAG $OS_FLAG"
        ./build_kernel.sh $DEVICE $KSU_FLAG $OS_FLAG

    - name: Upload Flashable AnyKernel3 ZIP
      uses: actions/upload-artifact@v7
      with:
        name: PixelOS-Alioth-Kernel-${{ github.event.inputs.ksu != false && 'ReSukiSU-SuSFS' || 'Vanilla' }}-${{ github.run_id }}
        path: PixelOS_*.zip
        compression-level: 0
